[project]
name = "robobrain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KasLoot", email = "steven.liu.yuxin@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.29.0",
    "langchain>=1.3.18",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "opencv-python>=5.0.0.93",
    "transformers>=5.16.1",
]

[project.scripts]
robobrain = "robobrain.__main__:main"
simulate_live_camera = "simulate_live_camera.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
