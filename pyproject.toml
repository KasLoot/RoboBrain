[project]
name = "robobrain"
version = "0.2.0"
description = "Real-time visual supervision of robot plug insertion"
readme = "README.md"
authors = [
    { name = "KasLoot", email = "steven.liu.yuxin@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "opencv-python>=4.11,<6",
]

[project.scripts]
robobrain = "robobrain.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
