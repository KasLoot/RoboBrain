[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "show-harness-mujoco"
version = "0.1.0"
description = "Independent MuJoCo-only Show-Harness runtime with dynamic monitor cameras"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "mujoco>=3.5,<4", "numpy>=1.26,<3", "scipy>=1.10", "opencv-python-headless>=4.10",
  "imageio>=2.35", "imageio-ffmpeg>=0.5", "Pillow>=10.4", "PyYAML>=6.0",
  "requests>=2.32", "fastapi>=0.115", "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
show-harness-mujoco = "show_harness_mujoco.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "interpreters*", "plugins*", "scripts*", "show_harness_mujoco*", "configs*", "prompts*", "assets*", "third_party*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.txt", "*.xml", "*.yaml", "LICENSE", "*.stl", "*.obj", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
